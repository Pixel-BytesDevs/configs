server:
  port: 8083
  address: 0.0.0.0

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Apuntamos al contenedor auth-server en la red de Docker
          issuer-uri: ${AUTH_ISSUER_URI:http://auth-server:9003}
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASS}